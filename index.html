<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Chart.js avec switch actif</title>

    <!-- Bibliothèques externes -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        /* ===== SWITCH ===== */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background-color: rgba(56, 73, 160, 1);
            border-radius: 26px;
            transition: .4s;
            cursor: pointer;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: .4s;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* ===== FLEX LIGNE SWITCH ===== */
        .filter-switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== GRAS / ACTIF ===== */
        #labelYear,
        #labelSpecies {
            transition: color 0.3s;
        }

        .active {
            font-weight: bold;
            color: black;
        }

        .inactive {
            font-weight: normal;
            color: gray;
        }

        /* ===== CHART ===== */
        #chartCanvas {
            width: 100%;
            max-width: 1000px;
            height: 450px;
            margin: 20px auto;
            display: block;
        }

        #filterContainer {
            margin-top: 20px;
            font-weight: bold;
        }

        #filterDropdown {
            margin-left: 5px;
            padding: 2px 5px;
        }
    </style>
</head>

<body>

    <!-- Switch Année / Espèce -->
    <div class="filter-switch-container">
        <span>
            Sélectionner le mode de filtrage :
            &nbsp;
            <strong id="labelYear">Année</strong>
        </span>

        <label class="switch">
            <input type="checkbox" id="filterSwitch">
            <span class="slider"></span>
        </label>

        <span>
            <strong id="labelSpecies">Espèce</strong>
        </span>
    </div>

    <!-- Dropdown -->
    <div id="filterContainer">
        <label id="filterLabel"></label>
        <select id="filterDropdown"></select>
    </div>

    <!-- Graphique -->
    <canvas id="chartCanvas"></canvas>

    <script>
        (async function () {

            // ============================================================
            // CONFIGURATION
            // ============================================================

            const csvUrl =
                'https://docs.google.com/spreadsheets/d/e/2PACX-1vRIctKK53M_uLqcrjBaBisEXFSb0WMBJwaRFmWl_sKwy2rB0nbZtZhjhmTVL4KDFEp6JjKE2Zaa7UJi/pub?gid=0&single=true&output=csv';


            // ============================================================
            // CHARGEMENT DU CSV
            // ============================================================

            let csvText;

            try {
                const response = await fetch(csvUrl);

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                csvText = await response.text();

            } catch (error) {

                console.error("Impossible de charger le CSV :", error);

                document.body.insertAdjacentHTML(
                    'beforeend',
                    '<p style="color:red;">Impossible de charger les données.</p>'
                );

                return;
            }


            // ============================================================
            // PARSING CSV
            // ============================================================

            const parsed = Papa.parse(csvText, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true
            });

            const rows = parsed.data.filter(
                row => row.Année && row.Nom_complet
            );


            // ============================================================
            // ELEMENTS DOM
            // ============================================================

            const filterSwitch =
                document.getElementById('filterSwitch');

            const filterLabel =
                document.getElementById('filterLabel');

            const filterDropdown =
                document.getElementById('filterDropdown');

            const chartCanvas =
                document.getElementById('chartCanvas');

            const labelYear =
                document.getElementById('labelYear');

            const labelSpecies =
                document.getElementById('labelSpecies');


            // ============================================================
            // EXTRACTION DES ANNEES ET ESPECES
            // ============================================================

            const years = Array.from(
                new Set(
                    rows.map(row => row.Année)
                )
            ).sort((a, b) => a - b);

            const species = Array.from(
                new Set(
                    rows.map(row => row.Nom_complet)
                )
            ).sort();


            // ============================================================
            // INSTANCE DU GRAPHIQUE
            // ============================================================

            let chartInstance = null;


            // ============================================================
            // MISE A JOUR DU DROPDOWN
            // ============================================================

            function updateUI() {

                filterDropdown.innerHTML = '';

                if (filterSwitch.checked) {

                    // Mode ESPÈCE

                    filterLabel.textContent = "Espèce :";

                    species.forEach(speciesName => {

                        const option =
                            document.createElement('option');

                        option.value = speciesName;
                        option.textContent = speciesName;

                        filterDropdown.appendChild(option);
                    });

                    if (species.length > 0) {
                        filterDropdown.value = species[0];
                    }

                } else {

                    // Mode ANNÉE

                    filterLabel.textContent = "Année :";

                    years.forEach(year => {

                        const option =
                            document.createElement('option');

                        option.value = year;
                        option.textContent = year;

                        filterDropdown.appendChild(option);
                    });

                    if (years.length > 0) {
                        filterDropdown.value = years[0];
                    }
                }
            }


            // ============================================================
            // STYLE DU LABEL ACTIF
            // ============================================================

            function updateLabelActive() {

                if (filterSwitch.checked) {

                    // ESPÈCE active

                    labelYear.classList.remove('active');
                    labelYear.classList.add('inactive');

                    labelSpecies.classList.remove('inactive');
                    labelSpecies.classList.add('active');

                } else {

                    // ANNÉE active

                    labelYear.classList.remove('inactive');
                    labelYear.classList.add('active');

                    labelSpecies.classList.remove('active');
                    labelSpecies.classList.add('inactive');
                }
            }


            // ============================================================
            // MISE A JOUR DU GRAPHIQUE
            // ============================================================

            function updateChart() {

                const modeSpecies =
                    filterSwitch.checked;

                const selectedValue =
                    filterDropdown.value;

                const pivot = {};


                // --------------------------------------------------------
                // Construction du pivot
                // --------------------------------------------------------

                rows.forEach(row => {

                    if (
                        !modeSpecies &&
                        row.Année === parseInt(selectedValue)
                    ) {

                        const key = row.Nom_complet;

                        if (!pivot[key]) {
                            pivot[key] = {
                                '-1': 0,
                                '0': 0,
                                '1': 0
                            };
                        }

                        if (
                            Object.prototype.hasOwnProperty.call(
                                pivot[key],
                                row.Sens
                            )
                        ) {
                            pivot[key][row.Sens] +=
                                Number(row.Quantité) || 0;
                        }
                    }


                    if (
                        modeSpecies &&
                        row.Nom_complet === selectedValue
                    ) {

                        const key = row.Année;

                        if (!pivot[key]) {
                            pivot[key] = {
                                '-1': 0,
                                '0': 0,
                                '1': 0
                            };
                        }

                        if (
                            Object.prototype.hasOwnProperty.call(
                                pivot[key],
                                row.Sens
                            )
                        ) {
                            pivot[key][row.Sens] +=
                                Number(row.Quantité) || 0;
                        }
                    }
                });


                // --------------------------------------------------------
                // Tri
                // --------------------------------------------------------

                const sortedKeys =
                    Object.keys(pivot).sort((a, b) => {

                        if (!modeSpecies) {

                            const totalA =
                                pivot[a]['-1'] +
                                pivot[a]['0'] +
                                pivot[a]['1'];

                            const totalB =
                                pivot[b]['-1'] +
                                pivot[b]['0'] +
                                pivot[b]['1'];

                            return totalB - totalA;

                        } else {

                            return Number(a) - Number(b);
                        }
                    });


                // --------------------------------------------------------
                // Jeux de données
                // --------------------------------------------------------

                const datasets = [

                    {
                        label: 'Dévalaison',
                        backgroundColor: '#d9e788',
                        data: sortedKeys.map(
                            key => pivot[key]['-1']
                        )
                    },

                    {
                        label: 'Indéterminé / aller-retour',
                        backgroundColor: '#7fcff6',
                        data: sortedKeys.map(
                            key => pivot[key]['0']
                        )
                    },

                    {
                        label: 'Montaison',
                        backgroundColor: '#9ba4cf',
                        data: sortedKeys.map(
                            key => pivot[key]['1']
                        )
                    }

                ];


                // --------------------------------------------------------
                // Données du graphique
                // --------------------------------------------------------

                const data = {
                    labels: sortedKeys,
                    datasets: datasets
                };


                // --------------------------------------------------------
                // Options
                // --------------------------------------------------------

                const options = {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {
                            position: 'top'
                        },

                        tooltip: {
                            mode: 'index',
                            intersect: false
                        },

                        zoom: {

                            pan: {
                                enabled: true,
                                mode: 'x'
                            },

                            zoom: {
                                wheel: {
                                    enabled: true
                                },

                                pinch: {
                                    enabled: true
                                },

                                mode: 'x'
                            }
                        }
                    },

                    scales: {

                        x: {
                            stacked: true
                        },

                        y: {
                            stacked: true,
                            beginAtZero: true
                        }
                    }
                };


                // --------------------------------------------------------
                // Destruction de l'ancien graphique
                // --------------------------------------------------------

                if (chartInstance) {
                    chartInstance.destroy();
                }


                // --------------------------------------------------------
                // Création du nouveau graphique
                // --------------------------------------------------------

                chartInstance = new Chart(
                    chartCanvas,
                    {
                        type: 'bar',
                        data: data,
                        options: options
                    }
                );
            }


            // ============================================================
            // EVENEMENTS
            // ============================================================

            filterSwitch.addEventListener(
                'change',
                () => {

                    updateLabelActive();
                    updateUI();
                    updateChart();
                }
            );


            filterDropdown.addEventListener(
                'change',
                updateChart
            );


            // ============================================================
            // INITIALISATION
            // ============================================================

            filterSwitch.checked = false;

            updateLabelActive();
            updateUI();
            updateChart();

        })();
    </script>

</body>
</html>
