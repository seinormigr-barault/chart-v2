
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Chart.js avec switch actif</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<style>
/* ===== SWITCH ===== */
.switch { position: relative; display: inline-block; width: 52px; height: 26px; }
.switch input { opacity:0;width:0;height:0; }
.slider { position:absolute; inset:0; background-color:rgba(56, 73, 160, 1); border-radius:26px; transition:.4s; cursor:pointer; }
.slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background-color:white; border-radius:50%; transition:.4s; }
input:checked + .slider:before { transform: translateX(26px); }

/* ===== FLEX LIGNE SWITCH ===== */
.filter-switch-container { display: flex; align-items: center; gap: 10px; }

/* ===== GRAS / ACTIF ===== */
#labelYear, #labelSpecies {
    transition: color 0.3s;  /* transition pour couleur si besoin */
}

.active {
    font-weight: bold;
    color: black; /* mot actif visible */
}

.inactive {
    font-weight: normal;
    color: gray;  /* mot inactif */
}

/* ===== CHART ===== */
#chartCanvas { width: 100%; max-width: 1000px; height: 450px; margin: 20px auto; display:block; }
#filterContainer { margin-top: 20px; font-weight: bold; }
#filterDropdown { margin-left: 5px; padding:2px 5px; }
</style>

<body>

<!-- Switch Année / Espèce -->
<div class="filter-switch-container">
    <span>Sélectionner le mode de filtrage : &nbsp;
        <strong id="labelYear">Année</strong>
    </span>
    <label class="switch">
        <input type="checkbox" id="filterSwitch">
        <span class="slider"></span>
    </label>
    <span>
        <strong id="labelSpecies">Espèce</strong>
    </span>
</div>

<!-- Dropdown unique -->
<div id="filterContainer">
    <label id="filterLabel"></label>
    <select id="filterDropdown"></select>
</div>

<canvas id="chartCanvas"></canvas>

<script>
(async function(){

// ==================== Charger CSV ====================
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRIctKK53M_uLqcrjBaBisEXFSb0WMBJwaRFmWl_sKwy2rB0nbZtZhjhmTVL4KDFEp6JjKE2Zaa7UJi/pub?gid=0&single=true&output=csv';
const response = await fetch(csvUrl);
const csvText = await response.text();
const parsed = Papa.parse(csvText, {header:true, dynamicTyping:true});
const rows = parsed.data.filter(r => r.Année && r.Nom_complet);

// ==================== DOM Elements ====================
const filterSwitch = document.getElementById('filterSwitch');
const filterLabel = document.getElementById('filterLabel');
const filterDropdown = document.getElementById('filterDropdown');
const chartCanvas = document.getElementById('chartCanvas');

const labelYear = document.getElementById('labelYear');
const labelSpecies = document.getElementById('labelSpecies');

// ==================== Extraire années et espèces ====================
const years = Array.from(new Set(rows.map(r=>r.Année))).sort((a,b)=>a-b);
const species = Array.from(new Set(rows.map(r=>r.Nom_complet))).sort();

// ==================== Initialisation chart ====================
let chartInstance = null;

// ==================== Mettre à jour UI et dropdown ====================
function updateUI(){
    filterDropdown.innerHTML = '';
    if(filterSwitch.checked){
        species.forEach(s => {
            let opt = document.createElement('option');
            opt.value = s; opt.text = s;
            filterDropdown.add(opt);
        });
        filterDropdown.value = species[0];
    } else {
        years.forEach(y => {
            let opt = document.createElement('option');
            opt.value = y; opt.text = y;
            filterDropdown.add(opt);
        });
        filterDropdown.value = years[0];
    }
}

// ==================== Mettre à jour le style actif ====================
function updateLabelActive() {
    if(filterSwitch.checked){
        labelYear.classList.remove('active');
        labelYear.classList.add('inactive');
        labelSpecies.classList.remove('inactive');
        labelSpecies.classList.add('active');
    } else {
        labelYear.classList.remove('inactive');
        labelYear.classList.add('active');
        labelSpecies.classList.remove('active');
        labelSpecies.classList.add('inactive');
    }
}

// ==================== Mettre à jour le graphique ====================
function updateChart(){
    const modeSpecies = filterSwitch.checked;
    const selectedValue = filterDropdown.value;
    let pivot = {};

    rows.forEach(row=>{
        if(!modeSpecies && row.Année===parseInt(selectedValue)){
            const key=row.Nom_complet;
            if(!pivot[key]) pivot[key]={'-1':0,'0':0,'1':0};
            pivot[key][row.Sens] += row.Quantité||0;
        }
        if(modeSpecies && row.Nom_complet===selectedValue){
            const key=row.Année;
            if(!pivot[key]) pivot[key]={'-1':0,'0':0,'1':0};
            pivot[key][row.Sens] += row.Quantité||0;
        }
    });

    const sortedKeys = Object.keys(pivot).sort((a,b)=>{
        if(!modeSpecies){
            const sa=pivot[a]['-1']+pivot[a]['0']+pivot[a]['1'];
            const sb=pivot[b]['-1']+pivot[b]['0']+pivot[b]['1'];
            return sb-sa;
        } else return a-b;
    });

    const datasets=[
        {label:'Dévalaison', backgroundColor:'#d9e788', data:sortedKeys.map(k=>pivot[k]['-1'])},
        {label:'Indéterminé / aller-retour', backgroundColor:'#7fcff6', data:sortedKeys.map(k=>pivot[k]['0'])},
        {label:'Montaison', backgroundColor:'#9ba4cf', data:sortedKeys.map(k=>pivot[k]['1'])}
    ];

    const data = { labels:sortedKeys, datasets:datasets };

    const options = {
        responsive:true,
        plugins:{
            legend:{ position:'top' },
            tooltip:{ mode:'index', intersect:false },
            zoom:{
                pan:{ enabled:true, mode:'x' },
                zoom:{ wheel:{enabled:true}, pinch:{enabled:true}, mode:'x' }
            }
        },
        scales:{
            x:{ stacked:true },
            y:{ stacked:true, beginAtZero:true }
        }
    };

    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(chartCanvas, { type:'bar', data:data, options:options });
}

// ==================== Events ====================
filterSwitch.addEventListener('change', ()=>{
    updateLabelActive();
    updateUI();
    updateChart();
});
filterDropdown.addEventListener('change', updateChart);

// ==================== Initialisation ====================
filterSwitch.checked = false;
updateLabelActive();
updateUI();
updateChart();

})();
</script>

</body>
